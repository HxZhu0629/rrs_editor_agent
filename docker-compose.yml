services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rrs-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rrs}
      POSTGRES_USER: ${POSTGRES_USER:-rrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrs_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rrs} -d ${POSTGRES_DB:-rrs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rrs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rrs-backend
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh /app/worker-entrypoint.sh
    environment:
      WORKER_METRICS_PORT: "9101"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backend_media:/app/media

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: rrs-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_media:
