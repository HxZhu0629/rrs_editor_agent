name: Reliability regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rrs_ci
          POSTGRES_PASSWORD: ephemeral_ci
          POSTGRES_DB: rrs_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U rrs_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: ${{ matrix.database }}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rrs_ci
      POSTGRES_PASSWORD: ephemeral_ci
      POSTGRES_DB: rrs_ci
      LANGFUSE_TRACING_ENABLED: "0"
      ACADEMIC_MCP_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/base.txt
      - run: pip install -r backend/requirements/base.txt
      - if: matrix.database == 'postgresql'
        run: python -c "import psycopg; connection = psycopg.connect('host=127.0.0.1 user=rrs_ci password=ephemeral_ci dbname=template1', autocommit=True); connection.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.close()"
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test apps.common apps.extraction apps.recommendations apps.agent --verbosity 1
      - run: python backend/manage.py evaluate_quality --cases data/evaluation/demo_cases.jsonl --output artifacts/evaluator-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluator-smoke-synthetic-${{ matrix.database }}
          path: artifacts/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
