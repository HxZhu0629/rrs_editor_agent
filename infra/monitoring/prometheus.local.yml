global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rrs-local-web
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:18060]
